aid: oboe
name: Oboe
description: >-
  Oboe is an AI-powered learning platform whose mission is to teach one billion
  people one trillion things. Positioned as "AI that won't make you stupid," it
  lets anyone learn virtually any subject through a conversational interface that
  generates personalized, on-demand courses and lessons ("magical courses made
  just for you"). Founded in New York and backed by Homebrew, Oboe is building
  what it calls the world's first completely generalized AI-powered learning
  platform, focused on making humans smarter rather than only making machines
  smarter. As a consumer web application, Oboe does not currently publish a public
  developer API, SDKs, or developer documentation; api.oboe.com serves only an XML
  sitemap index for public course pages.
